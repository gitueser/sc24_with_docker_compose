apiVersion: apps/v1
kind: Deployment
metadata:
  name: selmag-loki-deployment
  namespace: selmag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selmag-loki
  template:
    metadata:
      labels:
        app: selmag-loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.4
          args: ["-config.file=/etc/loki/local-config.yaml"]
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: loki-data
              mountPath: /loki
      volumes:
        - name: loki-data
          emptyDir: {}
