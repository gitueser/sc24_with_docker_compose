apiVersion: apps/v1
kind: Deployment
metadata:
  name: selmag-feedback-service-deployment
  namespace: selmag
  labels:
    app: selmag-feedback-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selmag-feedback-service
  template:
    metadata:
      labels:
        app: selmag-feedback-service
    spec:
      containers:
        - name: selmag-feedback-service
          image: host.docker.internal:5000/selmag/feedback-service:24.1.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
#              value: "cloudconfig"
              value: "cloudconfig,observability"
            - name: SERVER_PORT
              value: "8084"
          envFrom:
            - configMapRef:
                name: selmag-config
            - secretRef:
                name: selmag-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
