spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/selmag
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/selmag
            user-name-attribute: preferred_username
        registration:
          keycloak:
            authorization-grant-type: client_credentials
            scope:
              - metrics
            client-id: ${ADMIN_SERVICE_CLIENT_ID}
            client-secret: ${ADMIN_SERVICE_CLIENT_SECRET}
          login:
            provider: keycloak
            scope:
              - metrics
              - openid
            client-id: ${ADMIN_SERVICE_CLIENT_ID}
            client-secret: ${ADMIN_SERVICE_CLIENT_SECRET}
          discovery:
            provider: keycloak
            client-id: ${ADMIN_SERVICE_CLIENT_ID}
            client-secret: ${ADMIN_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - discovery
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  tracing:
    enabled: false

eureka:
  instance:
    hostname: admin-server
    leaseRenewalIntervalInSeconds: 20
    leaseExpirationDurationInSeconds: 60
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    registryFetchIntervalSeconds: 20
    register-with-eureka: false
