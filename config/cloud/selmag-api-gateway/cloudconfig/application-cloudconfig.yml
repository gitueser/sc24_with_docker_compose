selmag:
  dns:
    nip-host-suffix: ${SELMAG_BASE_DOMAIN:selm.ag}.${NIP_IO_IP:127.0.0.1}.${NIP_IO_SUFFIX:nip.io}
spring:
  cloud:
    gateway:
      forwarded:
        enabled: true

      default-filters:
        - PreserveHostHeader

      routes:
        - id: catalogue-service-route
          uri: ${CATALOGUE_SERVICE_URI:lb://selmag-catalogue-service}
          predicates:
            - Host=${CATALOGUE_SUBDOMAIN:catalogue.api}.${selmag.dns.nip-host-suffix}
#            - Host=${CATALOGUE_API_HOST:catalogue.api.selm.ag.127.0.0.1.nip.io}
        - id: feedback-service-route
          uri: ${FEEDBACK_SERVICE_URI:lb://selmag-feedback-service}
          predicates:
            - Host=${FEEDBACK_SUBDOMAIN:feedback.api}.${selmag.dns.nip-host-suffix}
#            - Host=${FEEDBACK_API_HOST:feedback.api.selm.ag.127.0.0.1.nip.io}
        - id: manager-app-route
          uri: ${MANAGER_APP_URI:lb://selmag-manager-app}
          predicates:
            - Host=${MANAGER_SUBDOMAIN:manager}.${selmag.dns.nip-host-suffix}
#            - Host=${MANAGER_UI_HOST:manager.selm.ag.127.0.0.1.nip.io}
        - id: customer-app-route
          uri: ${CUSTOMER_APP_URI:lb://selmag-customer-app}
          predicates:
            - Host=${CUSTOMER_SUBDOMAIN:customer}.${selmag.dns.nip-host-suffix}
#            - Host=${CUSTOMER_UI_HOST:customer.selm.ag.127.0.0.1.nip.io}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/selmag}
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/selmag}
        registration:
          discovery:
            provider: keycloak
            client-id: ${API_GATEWAY_CLIENT_ID}
            client-secret: ${API_GATEWAY_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - discovery
  application:
    name: selmag-api-gateway
  boot:
    admin:
      client:
        enabled: false
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
#        include: '*'
  tracing:
    enabled: false

eureka:
  instance:
    prefer-ip-address: true
    leaseRenewalIntervalInSeconds: 20
    leaseExpirationDurationInSeconds: 60
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULTZONE:http://eureka-server:8761/eureka/}
    registryFetchIntervalSeconds: 20
