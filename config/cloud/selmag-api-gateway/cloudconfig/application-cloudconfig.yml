spring:
  cloud:
    gateway:
      routes:
        - id: catalogue-service-route
          uri: lb://selmag-catalogue-service
          predicates:
            - Host=catalogue.api.selm.ag.127.0.0.1.nip.io
        - id: feedback-service-route
          uri: lb://selmag-feedback-service
          predicates:
            - Host=feedback.api.selm.ag.127.0.0.1.nip.io
        - id: manager-app-route
          uri: lb://selmag-manager-app
          predicates:
            - Host=manager.selm.ag.127.0.0.1.nip.io
        - id: customer-app-route
          uri: lb://selmag-customer-app
          predicates:
            - Host=customer.selm.ag.127.0.0.1.nip.io
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/selmag
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/selmag
        registration:
          discovery:
            provider: keycloak
            client-id: ${API_GATEWAY_CLIENT_ID}
            client-secret: ${API_GATEWAY_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - discovery
  application:
    name: selmag-api-gateway
  boot:
    admin:
      client:
        enabled: false
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
#        include: '*'
  tracing:
    enabled: false

eureka:
  instance:
    prefer-ip-address: true
    leaseRenewalIntervalInSeconds: 20
    leaseExpirationDurationInSeconds: 60
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    registryFetchIntervalSeconds: 20