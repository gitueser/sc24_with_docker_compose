spring:
  boot:
    admin:
      client:
        enabled: false
  datasource:
    url: ${CATALOGUE_DB_JDBC_URL:jdbc:postgresql://catalogue-db:5432/catalogue}
    username: ${CATALOGUE_DB_USER:catalogue}
    password: ${CATALOGUE_DB_PASSWORD:catalogue}
  flyway:
    schemas:
      - public
      - catalogue
  jpa:
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/selmag}
      client:
        registration:
          keycloak:
            client-id: ${CATALOGUE_SERVICE_CLIENT_ID}
            client-secret: ${CATALOGUE_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - metrics_server
          discovery:
            provider: keycloak
            client-id: ${CATALOGUE_SERVICE_CLIENT_ID}
            client-secret: ${CATALOGUE_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - discovery
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/selmag}
logging:
  level:
    sql: info
springdoc:
  swagger-ui:
    oauth:
      client-id: catalogue-service-swagger-ui
      use-pkce-with-authorization-code-grant: true
keycloak:
  uri: ${KEYCLOAK_URI:http://keycloak:8080}
management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  tracing:
    enabled: false

eureka:
  instance:
    prefer-ip-address: true
    leaseRenewalIntervalInSeconds: 20
    leaseExpirationDurationInSeconds: 60
  client:
    registryFetchIntervalSeconds: 20
    service-url:
      defaultZone: ${EUREKA_DEFAULTZONE:http://eureka-server:8761/eureka/}
