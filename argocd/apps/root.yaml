apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selmag-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:gitueser/sc24_with_docker_compose.git
    targetRevision: kubernetes-test-helm
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
