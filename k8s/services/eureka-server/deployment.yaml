apiVersion: apps/v1
kind: Deployment
metadata:
  name: selmag-eureka-server-deployment
  namespace: selmag
  labels:
    app: selmag-eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selmag-eureka-server
  template:
    metadata:
      labels:
        app: selmag-eureka-server
    spec:
      containers:
        - name: selmag-eureka-server
          image: host.docker.internal:5000/selmag/eureka-server:24.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
          # Забираем всё окружение из selmag-config/selmag-secret,
          # а ключевые для Eureka/ConfigClient фиксируем через valueFrom (без хардкода значений).
          envFrom:
            - configMapRef:
                name: selmag-config
            - secretRef:
                name: selmag-secret
          env:
            # Включаем профиль, в котором у тебя включен config import
            - name: SPRING_PROFILES_ACTIVE
              value: "cloudconfig"
            # Каноничный порт приложения внутри контейнера (используем в probes)
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: selmag-config
                  key: EUREKA_SERVER_PORT_INTERNAL
            # Eureka instance hostname (используется в cloudconfig yml)
            - name: EUREKA_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: selmag-config
                  key: EUREKA_HOSTNAME
            # Config Server доступ (как в application-cloudconfig.yml)
            - name: CONFIG_SERVER_URI
              valueFrom:
                configMapKeyRef:
                  name: selmag-config
                  key: CONFIG_SERVER_URI
            - name: CONFIG_SERVER_SECURITY_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: selmag-config
                  key: CONFIG_SERVER_SECURITY_USERNAME
            - name: CONFIG_SERVER_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: selmag-secret
                  key: CONFIG_SERVER_SECURITY_PASSWORD
            # OIDC client для eureka-server (берётся в cloudconfig)
            - name: EUREKA_SERVER_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: selmag-config
                  key: EUREKA_SERVER_CLIENT_ID
            - name: EUREKA_SERVER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: selmag-secret
                  key: EUREKA_SERVER_CLIENT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
