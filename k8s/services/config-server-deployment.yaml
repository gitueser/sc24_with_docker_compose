apiVersion: apps/v1
kind: Deployment
metadata:
  name: selmag-config-server-deployment
  namespace: selmag
  labels:
    app: selmag-config-server
spec:
  selector:
    matchLabels:
      app: selmag-config-server
  template:
    metadata:
      labels:
        app: selmag-config-server
    spec:
      containers:
        - name: selmag-config-server
          image: host.docker.internal:5000/selmag/config-server:24.1.1
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "git"
            - name: SERVER_PORT
              value: "8888"
          envFrom:
            - configMapRef:
                name: selmag-config
            - secretRef:
                name: selmag-secret
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  curl -fsS -u "$CONFIG_SERVER_SECURITY_USERNAME:$CONFIG_SERVER_SECURITY_PASSWORD"
                  "http://127.0.0.1:8888/actuator/health" >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  curl -fsS -u "$CONFIG_SERVER_SECURITY_USERNAME:$CONFIG_SERVER_SECURITY_PASSWORD"
                  "http://127.0.0.1:8888/actuator/health" >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: selmag-config-server-svc
  namespace: selmag
spec:
  type: ClusterIP
  selector:
    app: selmag-config-server
  ports:
    - name: http
      port: 8888
      targetPort: 8888
