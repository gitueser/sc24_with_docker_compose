apiVersion: v2
name: selmag
description: Selmag umbrella chart (Spring Boot microservices + platform components) for local minikube/WSL2 environment.
type: application
version: 0.1.0
appVersion: "24.1.1"

dependencies:
  - name: keycloak
    version: 0.1.0
    repository: "file://charts/keycloak"
    condition: keycloak.enabled

  - name: postgres-catalogue
    version: 0.1.0
    repository: "file://charts/postgres-catalogue"
    condition: postgres-catalogue.enabled

  - name: mongo-feedback
    version: 0.1.0
    repository: "file://charts/mongo-feedback"
    condition: mongo-feedback.enabled

  - name: config-server
    version: 0.1.0
    repository: "file://charts/config-server"
    condition: config-server.enabled

  - name: eureka-server
    version: 0.1.0
    repository: "file://charts/eureka-server"
    condition: eureka-server.enabled

  - name: admin-server
    version: 0.1.0
    repository: "file://charts/admin-server"
    condition: admin-server.enabled

  - name: catalogue-service
    repository: "file://charts/catalogue-service"
    version: 0.1.0
    condition: catalogue-service.enabled

  - name: feedback-service
    version: 0.1.0
    repository: "file://charts/feedback-service"
    condition: feedback-service.enabled

  - name: customer-app
    version: 0.1.0
    repository: "file://charts/customer-app"
    condition: customer-app.enabled

  - name: manager-app
    version: 0.1.0
    repository: "file://charts/manager-app"
    condition: manager-app.enabled

  - name: api-gateway
    version: 0.1.0
    repository: "file://charts/api-gateway"
    condition: api-gateway.enabled
