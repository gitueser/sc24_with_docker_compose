{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: {{ .Values.statefulset.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.statefulset.name }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
{{- end }}
