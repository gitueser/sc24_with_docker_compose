image:
  repository: host.docker.internal:5000/selmag/manager-app
  tag: "24.1.1"
  pullPolicy: Always

replicaCount: 1

service:
  name: selmag-manager-app-svc
  port: 8087
  targetPortName: http

deployment:
  name: selmag-manager-app-deployment
  appLabel: selmag-manager-app

env:
  springProfilesActive: "cloudconfig"
#  springProfilesActive: "cloudconfig,observability"
  serverPort: "8087"

probes:
  initialDelaySeconds: 60
  readinessPath: /actuator/health/readiness
  livenessPath: /actuator/health/liveness
  readinessPeriodSeconds: 10
  livenessPeriodSeconds: 20
  timeoutSeconds: 3
  readinessFailureThreshold: 12
  livenessFailureThreshold: 6
