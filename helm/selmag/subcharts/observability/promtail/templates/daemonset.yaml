apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "selmag.promtail.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "selmag.promtail.fullname" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "selmag.promtail.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "selmag.promtail.fullname" . }}
    spec:
      serviceAccountName: {{ include "selmag.promtail.serviceAccountName" . }}

      # Promtail обычно должен жить на каждой ноде и читать логи с filesystem ноды
      containers:
        - name: promtail
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config.file=/etc/promtail/promtail.yaml
            - -config.expand-env=true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9080

          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibcontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true

          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6

      volumes:
        - name: config
          configMap:
            name: {{ include "selmag.promtail.fullname" . }}-config

        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate

        - name: varlogpods
          hostPath:
            path: /var/log/pods

        - name: varlibcontainers
          hostPath:
            path: /var/lib/docker/containers

        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: Directory
