apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "grafana.labels" . | nindent 4 }}
  ports:
    - name: {{ .Values.service.targetPortName }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPortName }}
