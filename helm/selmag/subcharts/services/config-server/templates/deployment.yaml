apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  labels:
    {{- include "config-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "config-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "config-server.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.deployment.appLabel }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: {{ .Values.service.targetPortName }}
              containerPort: {{ .Values.containerPort }}

          envFrom:
            - configMapRef:
                name: {{ $.Values.global.configMapName }}
            - secretRef:
                name: {{ $.Values.global.secretName }}

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.springProfilesActive | quote }}

            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.global.configMapName }}
                  key: {{ .Values.envKeys.serverPortKey }}

            - name: CONFIG_SERVER_SECURITY_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.global.configMapName }}
                  key: {{ .Values.envKeys.securityUsernameKey }}

            - name: CONFIG_GIT_LABEL
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.global.configMapName }}
                  key: {{ .Values.envKeys.gitLabelKey }}

            - name: CONFIG_SERVER_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: {{ .Values.envKeys.securityPasswordKey }}

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  curl -fsS
                  -u "$CONFIG_SERVER_SECURITY_USERNAME:$CONFIG_SERVER_SECURITY_PASSWORD"
                  "http://127.0.0.1:$SERVER_PORT{{ .Values.probes.actuatorHealthPath }}"
                  >/dev/null
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readinessPeriodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readinessFailureThreshold }}

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  curl -fsS
                  -u "$CONFIG_SERVER_SECURITY_USERNAME:$CONFIG_SERVER_SECURITY_PASSWORD"
                  "http://127.0.0.1:$SERVER_PORT{{ .Values.probes.actuatorHealthPath }}"
                  >/dev/null
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.livenessPeriodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.livenessFailureThreshold }}
