image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

service:
  name: selmag-catalogue-db-svc
  type: ClusterIP
  port: 5432
  portName: postgresql
  targetPortName: postgresql

statefulset:
  name: selmag-catalogue-db
  appLabel: selmag-catalogue-db
  replicas: 1

persistence:
  enabled: true
  pvcName: selmag-catalogue-db-pvc
  size: 2Gi
  accessModes:
    - ReadWriteOnce
  # storageClassName: ""  # если нужно явно

env:
  userKey: CATALOGUE_DB_USER
  dbKey: CATALOGUE_DB_NAME
  passwordKey: CATALOGUE_DB_PASSWORD

probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 6
