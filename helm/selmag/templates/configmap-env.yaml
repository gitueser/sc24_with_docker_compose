{{- if .Values.bootstrap.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "selmag.configMapName" . }}
data:
  {{- $path := .Values.global.envFiles.config | default "files/.env.config" -}}
  {{- $raw := .Files.Get $path | default "" -}}
  {{- if eq $raw "" }}
  _error: {{ printf "%s is missing in the chart" $path | quote }}
  {{- else }}
  {{- range $line := splitList "\n" $raw }}
  {{- $l := trim $line }}
  {{- if and (ne $l "") (not (hasPrefix "#" $l)) }}
  {{- $parts := splitList "=" $l }}
  {{- if ge (len $parts) 2 }}
  {{ index $parts 0 }}: {{ join "=" (slice $parts 1) | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
