{{- if .Values.bootstrap.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "selmag.secretName" . }}
type: Opaque
stringData:
  {{- $raw := .Files.Get "files/.env.secret" | default "" -}}
  {{- if eq $raw "" }}
_error: "files/.env.secret is missing in the chart"
  {{- else }}
  {{- range $line := splitList "\n" $raw }}
  {{- $l := trim $line }}
  {{- if and (ne $l "") (not (hasPrefix "#" $l)) }}
  {{- $parts := splitList "=" $l }}
  {{- if ge (len $parts) 2 }}
  {{ index $parts 0 }}: {{ join "=" (slice $parts 1) | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
