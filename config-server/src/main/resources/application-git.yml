spring:
  application:
    name: selmag-config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/gitueser/sc24_with_docker_compose
#          uri: https://github.com/alex-kosarev/sc24-confg.git
          clone-on-start: true
          default-label: ${CONFIG_GIT_LABEL:kubernetes-test}
#          default-label: master
          search-paths:
            - 'config/cloud/{application}/{profile}'
#            - '{application}/{profile}'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
