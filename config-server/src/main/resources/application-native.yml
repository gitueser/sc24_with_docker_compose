spring:
  application:
    name: selmag-config-server
  cloud:
    config:
      server:
        native:
          search-locations: file:///app-config/{application}/{profile}
#          search-locations: file:///config/{application}/{profile}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
